[project]
name = "secrag"
version = "0.1.0"
description = "SEC filings RAG pipeline with numeric-aware evaluation"
requires-python = ">=3.10"
dependencies = [
    "edgartools>=5.42.0",
    "anthropic>=0.40.0",
    "qdrant-client>=1.12.0",
    "fastembed>=0.4.0",
    "typer>=0.13.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "datasets>=3.0.0",
    "pymupdf>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
secrag = "secrag.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["secrag*"]
